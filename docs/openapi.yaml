openapi: 3.1.0
info:
  title: SeyFert API
  version: 1.0.0
  description: API REST de catálogo, pedidos y administración de SeyFert.
servers:
  - url: http://localhost:4001/api
tags:
  - name: Catálogo
  - name: Autenticación
  - name: Pedidos
  - name: Administración
security: []
paths:
  /health:
    get:
      tags: [Administración]
      summary: Verificar disponibilidad de la API
      responses:
        '200': { description: API disponible }
  /productos:
    get:
      tags: [Catálogo]
      summary: Buscar productos activos con filtros y paginación
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: categoriaId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: marcaId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: genero, schema: { type: string, enum: [DAMA, CABALLERO, UNISEX] } }
        - { in: query, name: precioMin, schema: { type: number, minimum: 0 } }
        - { in: query, name: precioMax, schema: { type: number, minimum: 0 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: Página de productos }
        '400': { description: Parámetros no válidos }
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar una cuenta CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, clave]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                clave: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '201': { description: Cuenta creada }
        '400': { description: Datos inválidos }
        '409': { description: Correo ya registrado }
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string, format: email }
                clave: { type: string }
      responses:
        '200': { description: Token y datos de sesión }
        '401': { description: Credenciales incorrectas }
  /auth/perfil:
    get:
      tags: [Autenticación]
      summary: Consultar perfil
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil actual }
        '401': { description: Sesión inválida }
    put:
      tags: [Autenticación]
      summary: Actualizar perfil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
      responses:
        '200': { description: Perfil actualizado }
        '400': { description: Datos inválidos }
        '409': { description: Correo duplicado }
  /pedidos:
    post:
      tags: [Pedidos]
      summary: Crear un pedido y reservar existencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreCliente, telefono, direccion, items]
              properties:
                nombreCliente: { type: string }
                telefono: { type: string }
                direccion: { type: string }
                notas: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productoId, cantidad]
                    properties:
                      productoId: { type: integer, minimum: 1 }
                      cantidad: { type: integer, minimum: 1 }
      responses:
        '201': { description: Pedido creado }
        '400': { description: Datos inválidos o existencias insuficientes }
    get:
      tags: [Pedidos]
      summary: Listar pedidos para administración
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pedidos con sus líneas }
        '401': { description: Sesión inválida }
        '403': { description: Se requiere ADMIN }
  /pedidos/{id}:
    patch:
      tags: [Pedidos]
      summary: Cambiar el estado de un pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [CONFIRMADO, ENTREGADO, CANCELADO] }
      responses:
        '200': { description: Estado actualizado }
        '400': { description: Transición inválida }
        '403': { description: Se requiere ADMIN }
  /dashboard:
    get:
      tags: [Administración]
      summary: Consultar indicadores actuales
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Indicadores de inventario y pedidos }
        '403': { description: Se requiere ADMIN }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
